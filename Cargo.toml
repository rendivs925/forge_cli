[workspace]
members = ["crates/forge-cli", "crates/forge-analysis", "crates/forge-config", "crates/forge-core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
